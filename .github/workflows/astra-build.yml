name: Astra build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Python unit and HTTP tests
        run: python3 -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: for f in web/*.js; do node --check "$f"; done
      - name: Build portable archive
        run: python3 tools/package.py
      - name: Inspect archive
        run: tar -tzf dist/AfterSilence-Astra-0.4.0.tar.gz
      - name: Upload portable archive
        uses: actions/upload-artifact@v4
        with:
          name: AfterSilence-Astra-0.4.0
          path: dist/AfterSilence-Astra-0.4.0.tar.gz
