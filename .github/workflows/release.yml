name: Release

# A push to main with a version that has no release yet (world_data.VERSION) tests the game,
# builds the Astra Linux archive and publishes release vX.Y.Z with it; the notes come from CHANGELOG.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Is this version released already?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import world_data; print(world_data.VERSION)")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.new == 'true'
        with:
          python-version: '3.9'
      - name: Python unit and HTTP tests
        if: steps.check.outputs.new == 'true'
        run: python3 -m unittest discover -s tests
      - name: JavaScript syntax
        if: steps.check.outputs.new == 'true'
        run: for f in web/*.js; do node --check "$f"; done
      - name: Build portable archive
        if: steps.check.outputs.new == 'true'
        run: python3 tools/package.py
      - name: Release notes from the changelog
        if: steps.check.outputs.new == 'true'
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          python3 - <<'EOF'
          import os, re
          version = os.environ['TAG'][1:]
          text = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(r'^## ' + re.escape(version) + r'\n(.*?)(?=^## |\Z)', text, re.S | re.M)
          notes = (m.group(1).strip() if m else 'См. CHANGELOG.md.')
          notes += '\n\n**Установка:** скачай AfterSilence-Astra-' + version + '.tar.gz, распакуй в свою папку и запусти «Играть.sh». Нужны только Python 3.7+ и браузер, права администратора не нужны.'
          open('notes.md', 'w', encoding='utf-8').write(notes)
          EOF
      - name: Publish release
        if: steps.check.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
        run: gh release create "$TAG" dist/AfterSilence-Astra-*.tar.gz --target "$GITHUB_SHA" --title "После тишины ${TAG#v}" --notes-file notes.md
