<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>После тишины · Россия</title>
  <meta name="description" content="Автономная 2D-игра об исследовании России и восстановлении поселений.">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
  <canvas id="world" aria-label="Игровой мир"></canvas>
  <div id="vignette"></div>
  <main id="hud" class="hidden">
    <header id="topbar">
      <div class="brand"><b>ПОСЛЕ ТИШИНЫ<span class="accent">.</span></b><span>ЭКСПЕДИЦИЯ / РОССИЯ</span></div>
      <div id="resources"></div>
      <div class="top-actions"><div id="clock"></div><button id="sound" class="icon-button" title="Звук" aria-label="Переключить звук"></button><button id="full" class="icon-button" title="Полный экран" aria-label="Полный экран"></button><button id="menu" class="icon-button" title="Меню · Esc" aria-label="Открыть меню"></button></div>
    </header>
    <section id="location"><span class="eyebrow">ТЕКУЩЕЕ МЕСТО</span><h2 id="location-name"></h2><span id="location-desc"></span></section>
    <aside id="mission"><div class="section-label"><span>ЖУРНАЛ ЭКСПЕДИЦИИ</span><span id="quest-index"></span></div><h3 id="quest-title"></h3><p id="quest-desc"></p><div id="quest-progress"></div></aside>
    <button id="minimap-wrap" aria-label="Открыть карту России"><canvas id="minimap" width="250" height="160"></canvas><span><b>КАРТА ЭКСПЕДИЦИИ</b><kbd>M</kbd></span></button>
    <aside id="town-info"></aside>
    <div id="vitals"></div>
    <div id="bottom-status"><div id="coins"></div><div id="level"></div><div id="mode"></div><div id="stamina"><i></i></div><span id="autosave">Прогресс сохраняется автоматически</span></div>
    <div id="interaction" class="hidden"></div>
    <div id="key-guide"><span><kbd>WASD</kbd> движение</span><span><kbd>E</kbd> действие</span><span><kbd>F</kbd> машина</span><span><kbd>Q</kbd> оружие</span><span><kbd>X</kbd> перезарядка</span><span><kbd>L</kbd> лагерь</span><span><kbd>C</kbd> крафт</span><span><kbd>I</kbd> рюкзак</span><span><kbd>J</kbd> журнал</span><span>ЛКМ огонь</span></div>
  </main>
  <div id="toast-stack" aria-live="polite"></div>
  <div id="screen"></div>
  <input id="import-file" type="file" accept=".json,application/json" hidden>
  <script src="sprites.js"></script>
  <script src="render.js"></script>
  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
