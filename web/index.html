<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>После тишины</title>
  <meta name="description" content="2D-выживание с видом сверху: побережье, заражённые, лут в домах и другие игроки.">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
  <canvas id="world" aria-label="Игровой мир"></canvas>
  <div id="vignette"></div>
  <main id="hud" class="hidden">
    <header id="topbar">
      <div class="brand"><b>ПОСЛЕ ТИШИНЫ<span class="accent">.</span></b><span>БЕЛОГОРЬЕ</span></div>
      <div id="status-line"></div>
      <div class="top-actions"><div id="clock"></div><button id="sound" class="icon-button" title="Звук" aria-label="Переключить звук"></button><button id="full" class="icon-button" title="Полный экран" aria-label="Полный экран"></button><button id="menu" class="icon-button" title="Меню · Esc" aria-label="Открыть меню"></button></div>
    </header>
    <aside id="nav">
      <button id="minimap-wrap" aria-label="Открыть карту · M"><canvas id="minimap" width="250" height="160"></canvas><kbd>M</kbd></button>
      <div id="where"><b id="location-name"></b><span id="location-desc"></span></div>
    </aside>
    <section id="me-panel">
      <canvas id="me-icon" width="128" height="128"></canvas>
      <div class="me-main">
        <div class="me-head"><b id="me-name"></b><span id="level"></span></div>
        <div class="hbar hp" title="Здоровье"><i></i><span></span></div>
        <div class="hbar st" title="Выносливость"><i></i></div>
        <div id="vitals"></div>
        <div id="coins"></div>
      </div>
    </section>
    <section id="gear-panel"></section>
    <div id="interaction" class="hidden"></div>
    <div id="key-guide"><span><kbd>WASD</kbd> движение</span><span><kbd>E</kbd> взять</span><span><kbd>I</kbd> инвентарь</span><span><kbd>F</kbd> машина</span><span><kbd>Q</kbd> оружие</span><span><kbd>X</kbd> перезарядка</span><span><kbd>H</kbd> перевязка</span><span><kbd>L</kbd> лагерь</span><span><kbd>C</kbd> крафт</span><span>ЛКМ удар / выстрел</span></div>
    <span id="autosave"></span>
  </main>
  <div id="toast-stack" aria-live="polite"></div>
  <div id="screen"></div>
  <script src="sprites.js"></script>
  <script src="render.js"></script>
  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
